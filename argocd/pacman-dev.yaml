apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pacman-dev
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/marrober/pacman-konflux-gitops.git
    targetRevision: main
    path: components/pacman/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: pacman-konflux-dev
  ignoreDifferences:
  - group: route.openshift.io
    kind: Route
    jsonPointers:
    - /spec/host
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - Validate=true
