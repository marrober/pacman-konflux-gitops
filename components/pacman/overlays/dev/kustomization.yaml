apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pacman-konflux-dev

resources:
- ../../base
- namespace.yaml

labels:
- pairs:
    app.kubernetes.io/instance: pacman-dev
    app.kubernetes.io/environment: dev
  includeSelectors: true

# Konflux / release automation updates newName / newTag / digest here.
images:
- name: quay.io/redhat-user-workloads/pacman-konflux/pacman/pacman
  newTag: latest
